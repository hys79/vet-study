<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바이러스 분류 퀴즈</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#14202b;--sub:#5b6b78;--line:#d5dede;--acc:#0f766e;--ok:#15803d;--okbg:#dcfce7;--no:#b91c1c;--nobg:#fee2e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181d;--card:#18232a;--ink:#e8eef1;--sub:#97a8b3;--line:#2c3b44;--acc:#2dd4bf;--ok:#4ade80;--okbg:#14351f;--no:#f87171;--nobg:#3b1818}}
:root[data-theme="dark"]{--bg:#10181d;--card:#18232a;--ink:#e8eef1;--sub:#97a8b3;--line:#2c3b44;--acc:#2dd4bf;--ok:#4ade80;--okbg:#14351f;--no:#f87171;--nobg:#3b1818}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}
p.sub{color:var(--sub);margin:0 0 20px;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
.mode{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.mode b{display:block;font-size:18px}
.chart{overflow:auto;border-radius:12px;border:1.5px solid var(--line);background:#fff;margin:10px 0 12px;max-height:75vh}
.chart img{display:block;width:100%}
.chart.big img{width:220%}
.back{background:none;border:0;color:var(--sub);font-size:16px;padding:6px 0;margin-bottom:4px}
.back:focus-visible{outline:2px solid var(--acc)}
.mode:active,.mode:focus-visible{border-color:var(--acc);outline:none}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:14px}
.q{font-size:21px;font-weight:700;line-height:1.4;margin:22px 0 18px;letter-spacing:-.01em}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:17px}
.opt:focus-visible{outline:2px solid var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok);font-weight:700}
.opt.no{background:var(--nobg);border-color:var(--no)}
.opt[disabled]{cursor:default}
.exp{background:var(--card);border-left:4px solid var(--acc);border-radius:8px;padding:12px 14px;margin:14px 0;font-size:15px}
.chip{display:inline-block;color:#fff;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700;margin-right:4px}
.btn{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:700;margin-top:6px}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.score{font-size:56px;font-weight:800;margin:10px 0 0;letter-spacing:-.03em}
.wrong{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:15px}
.wrong b{display:block;margin-bottom:2px}
.ans{color:var(--ok);font-weight:700}
</style>
</head>
<body>
<main id="app"></main>
<script src="../../shared/qn.js"></script><script src="../../shared/audio.js"></script><script src="../../shared/zoom.js"></script>
<script>
const T=[["dsDNA","I","#2563eb"],["ssDNA","II","#7c3aed"],["dsRNA","III","#0d9488"],["(+)ssRNA","IV","#dc2626"],["(−)ssRNA","V","#ea580c"],["RNA 역전사","VI","#a16207"],["DNA 역전사","VII","#475569"]];
// [과, 타입idx, 외피(1/0), 대표 질병]
const V=[["Poxviridae", 0, 1, ["백시니아", "우두", "가성우두", "럼피스킨병"], "Orthopoxvirus, Parapoxvirus, Avipoxvirus, Capripoxvirus, Suipoxvirus", ""], ["Asfarviridae", 0, 1, ["아프리카돼지열병(ASF)"], "Asfivirus", "이름의 유래: ASF"], ["Iridoviridae", 0, 0, [], "", "Irido = 빛난다"], ["Adenoviridae", 0, 0, [], "Aviadenovirus", "penton fiber: 특징적 spike"], ["Herpesviridae", 0, 1, ["소 바이러스성 유방염(BHV-2)", "돼지 가성광견병(오제스키병)", "소 전염성비기관지염(BHV-1)", "조류 마렉병", "조류 ILT", "악성 카타르열"], "Simplexvirus, Varicellovirus, Mardivirus, Iltovirus, Macavirus", "Herpes = 부족하다 · 잠복감염"], ["Polyomaviridae", 0, 0, [], "", "가축에서는 큰 문제 X"], ["Papillomaviridae", 0, 0, ["자궁경부암(HPV)"], "Papillomavirus", "가축에서는 큰 문제 X"], ["Parvoviridae", 1, 0, ["개 파보질환", "고양이 범백혈구감소증", "돼지 불임증(SMEDI)"], "Protoparvovirinae", "Parvo = small"], ["Circoviridae", 1, 0, ["돼지 이유후 전신소모증후군(PMWS)", "닭 빈혈"], "Circovirus, Gyrovirus", "Circo = 원(circle) · circular DNA"], ["Reoviridae", 2, 0, ["블루텅", "아프리카마역", "포유류·조류 설사증"], "Orbivirus, Rotavirus", "RNA 10~12 segment"], ["Birnaviridae", 2, 0, ["IPN(전염성췌장괴사)", "조류 IBD(F낭병)"], "Aquabirnavirus, Avibirnavirus", "Bi(2) + RNA · 2 segment"], ["Caliciviridae", 3, 0, ["고양이 칼리시바이러스 감염", "돼지 수포진", "사람 바이러스성 식중독"], "Vesivirus, Norovirus", ""], ["Hepeviridae", 3, 0, ["E형 간염"], "Hepevirus", ""], ["Flaviviridae", 3, 1, ["황열", "일본뇌염", "말 웨스트나일병", "면양 Louping ill", "소 BVD-MD", "돼지열병(CSF)", "면양 Border disease", "C형 간염"], "Flavivirus, Pestivirus, Hepacivirus", "Flavi = Yellow"], ["Togaviridae", 3, 1, ["동부말뇌척수염(EEV)"], "Alphavirus", "대부분 Arbovirus(절지동물 매개)"], ["Picornaviridae", 3, 0, ["A형 간염", "구제역(FMD)", "말 비염", "돼지 테센병", "돼지 수포병", "Seneca valley virus 감염", "조류 뇌척수염"], "Hepatovirus, Aphthovirus, Erbovirus, Teschovirus, Enterovirus, Senecavirus, Tremovirus", "Pico(작다) + RNA"], ["Arteriviridae", 3, 1, ["말 전염성 동맥염", "실험동물 LDH 상승 바이러스", "돼지 PRRS"], "Equarterivirinae, Variarterivirinae, Betaarterivirus", "Arteri = 동맥"], ["Coronaviridae", 3, 1, ["돼지유행성설사증(PED)", "돼지 전염성위장염(TGE)", "개 코로나바이러스", "고양이 전염성복막염(FIP)", "SARS", "COVID-19", "조류 전염성기관지염", "동물 설사증"], "Alphacoronavirus, Betacoronavirus, Gammacoronavirus, Deltacoronavirus, Torovirus", "Corona = 왕관"], ["Bornaviridae", 4, 1, ["말 보르나병"], "Orthobornavirus", ""], ["Rhabdoviridae", 4, 1, ["광견병", "수포성 구내염"], "Lyssavirus, Vesiculovirus", "Rhabdo = 막대기"], ["Filoviridae", 4, 1, ["에볼라"], "Ebolavirus", ""], ["Paramyxoviridae", 4, 1, ["조류 뉴캐슬병", "개 유행성이하선염", "우역", "개 디스템퍼"], "Avulavirus, Rubulavirus, Morbillivirus", "Myxo = 점막(호흡기)"], ["Pneumoviridae", 4, 1, ["소 호흡기 합포체 바이러스 감염"], "Orthopneumovirus", ""], ["Peribunyaviridae", 4, 1, ["아카바네병"], "Orthobunyavirus", ""], ["Hantaviridae", 4, 1, ["유행성 출혈열(신부전증)"], "Orthohantavirus", "한탄강 유역 · 흰등줄쥐가 전파"], ["Phenuiviridae", 4, 1, ["면양 리프트밸리열"], "Phlebovirus", ""], ["Orthomyxoviridae", 4, 1, ["조류독감(AI)"], "Alpha·Beta·Gammainfluenzavirus", "Myxo = 점막(호흡기)"], ["Arenaviridae", 4, 1, ["실험동물 림프구성 맥락수막염(LCM)"], "Arenavirus", ""], ["Retroviridae", 5, 1, ["AIDS(HIV 감염)", "고양이 FIV 감염", "고양이 백혈병(FeLV)", "소 백혈병"], "Lentivirus, Gammaretrovirus, Deltaretrovirus", "역전사효소"], ["Hepadnaviridae", 6, 1, ["오리 간염 B형"], "Avihepadnavirus", "hepa(간) + DNA · 역전사효소"]];
const VD=V.filter(v=>v[3].length);
const MODES=[
["t2f","핵산 유형 → 과"],
["d2f","질병 → 과"],
["env","외피 유무"],
["mix","전체 랜덤"],
["pr","실전 연습"]
];
const $=document.getElementById("app");
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const chip=t=>`<span class="chip" style="background:${T[t][2]}">${T[t][1]} ${T[t][0]}</span>`;
function note(f){return `<b>${f[0]}</b><br>${chip(f[1])} ${f[2]?"외피 O":"외피 X"}<br>${f[5]?f[5]+"<br>":""}속: ${f[4]||"-"}<br>대표 질병: ${f[3].join(", ")||"교재 표기 없음"}`}

const tl=t=>T[t][0],ev=e=>e?"외피가 있다":"외피가 없다",ef=e=>e?"외피 O":"외피 X";
const stmt=(d,fam,t,e)=>`${d}의 원인 바이러스는 ${fam}에 속하는 ${tl(t)} 바이러스이며, ${ev(e)}.`;
const other=(arr,x)=>shuf(arr.filter(v=>v!==x));
function practice(){
  const kind=rnd(["s1","s2","c1","c2","p1","g1"]),f=["c2","p1","g1"].includes(kind)?rnd(V):rnd(VD),d=f[3].length?rnd(f[3]):"";
  if(kind==="s1"){
    const g=other(V,f),t2=rnd(T.map((_,i)=>i).filter(i=>i!==f[1])),e2=f[2]?0:1;
    const ok=stmt(d,f[0],f[1],f[2]);
    const bad=[stmt(d,g[0][0],f[1],f[2]),stmt(d,f[0],t2,f[2]),stmt(d,f[0],f[1],e2),stmt(d,g[1][0],f[1],e2)];
    const opts=shuf([ok,...bad]);
    return {q:"다음 중 옳은 설명은?",opts,a:opts.indexOf(ok),html:note(f)};
  }
  if(kind==="s2"){
    const h=shuf(VD).slice(0,5),w=h[4],wd=rnd(w[3]);
    const m=Math.floor(Math.random()*3);
    const bad=m===0?stmt(wd,rnd(other(V,w))[0],w[1],w[2]):m===1?stmt(wd,w[0],rnd(T.map((_,i)=>i).filter(i=>i!==w[1])),w[2]):stmt(wd,w[0],w[1],w[2]?0:1);
    const goods=h.slice(0,4).map(v=>stmt(rnd(v[3]),v[0],v[1],v[2]));
    const opts=shuf([bad,...goods]);
    return {q:"다음 중 옳지 않은 설명은?",opts,a:opts.indexOf(bad),html:`바르게 고치면:<br><b>${stmt(wd,w[0],w[1],w[2])}</b>`};
  }
  if(kind==="c1"){
    const seen=new Set([f[1]+"/"+f[2]]),combos=[[f[1],f[2]]];
    const add=(t,e)=>{const k=t+"/"+e;if(!seen.has(k)){seen.add(k);combos.push([t,e])}};
    add(f[1],f[2]?0:1);add(rnd(T.map((_,i)=>i).filter(i=>i!==f[1])),f[2]);
    while(combos.length<5)add(Math.floor(Math.random()*7),Math.round(Math.random()));
    const c=shuf(combos);
    const opts=c.map(x=>`${tl(x[0])} · ${ef(x[1])}`);
    return {q:`${d}의 원인 바이러스의 핵산 유형과 외피 유무로 옳은 것은?`,opts,a:c.findIndex(x=>x[0]===f[1]&&x[1]===f[2]),html:note(f)};
  }
  if(kind==="p1"){
    const dna=v=>[0,1,6].includes(v[1]);
    const [lab,pr]=rnd([["DNA 바이러스",dna],["RNA 바이러스",v=>!dna(v)],["외피가 있는 바이러스",v=>v[2]===1],["외피가 없는 바이러스",v=>v[2]===0]]);
    const yes=V.filter(pr),no=V.filter(v=>!pr(v)),good=shuf(yes).slice(0,2),bad=[],ks=new Set();
    while(bad.length<4){const pr2=Math.random()<.5?shuf([rnd(yes),rnd(no)]):shuf(no).slice(0,2),k=pr2.map(v=>v[0]).sort().join();if(!ks.has(k)){ks.add(k);bad.push(pr2)}}
    const txt=x=>x.map(v=>v[0]).join(", "),ok=txt(good),opts=shuf([ok,...bad.map(txt)]);
    return {q:`다음 중 ${lab} 과끼리 짝지어진 것은?`,opts,a:opts.indexOf(ok),html:`${lab} 과: ${yes.map(v=>v[0]).join(", ")}`};
  }
  if(kind==="g1"){
    const TR=["외피는 지질 성분을 포함한다.","외피는 주로 숙주세포의 막에서 유래한다.","외피가 있는 바이러스는 에테르 같은 지질용매에 약하다.","외피가 있는 바이러스는 일반적으로 환경·소독제에 약하다.","Picornaviridae, Caliciviridae처럼 외피가 없는 RNA 바이러스도 있다.","Herpesviridae, Poxviridae는 외피를 가진 DNA 바이러스이다."];
    const FA=["모든 RNA 바이러스는 외피를 가진다.","모든 DNA 바이러스는 외피가 없다.","Reoviridae와 Birnaviridae는 외피를 가진다.","외피가 없는 바이러스가 소독제에 더 약하다."];
    const neg=Math.random()<.5,one=neg?rnd(FA):rnd(TR),opts=shuf([one,...shuf(neg?TR:FA).slice(0,4)]);
    return {q:`바이러스 외피(envelope)에 대한 설명으로 ${neg?"옳지 않은":"옳은"} 것은?`,opts,a:opts.indexOf(one),html:`외피 없는 과: ${V.filter(v=>!v[2]).map(v=>v[0]).join(", ")}`};
  }
  const t=f[1],e=f[2],fit=v=>v[1]===t&&v[2]===e;
  const near=[...other(V.filter(v=>v[1]===t&&v[2]!==e),f).slice(0,2),...other(V.filter(v=>v[1]!==t&&v[2]===e),f).slice(0,2)];
  const rest=shuf(V.filter(v=>!fit(v)&&!near.includes(v)));
  const ds=[...near,...rest].slice(0,4);
  const opts=shuf([f[0],...ds.map(v=>v[0])]);
  return {q:`핵산이 ${tl(t)}이고 ${e?"외피가 있는":"외피가 없는"} 바이러스 과는?`,opts,a:opts.indexOf(f[0]),html:`조건에 맞는 과: ${V.filter(fit).map(v=>v[0]).join(", ")}<br>${note(f)}`};
}

function make(kind){
  if(kind==="pr")return practice();
  if(kind==="mix")kind=rnd(["t2f","d2f","env"]);
  const f=(kind==="d2f"||kind==="d2t")?rnd(VD):rnd(V);let q,opts,a;
  if(kind==="t2f"){
    const t=f[1],mem=V.filter(v=>v[1]===t),out=V.filter(v=>v[1]!==t);
    const list=`${chip(t)} 소속 과: ${mem.map(v=>v[0]).join(", ")}`;
    if(mem.length>=4&&Math.random()<.5){
      const o=rnd(out),pick3=shuf(mem).slice(0,3);
      q=`다음 중 ${T[t][0]}(${T[t][1]}형) 바이러스에 속하지 않는 과는?`;
      opts=shuf([o[0],...pick3.map(v=>v[0])]);a=opts.indexOf(o[0]);
      return {q,opts,a,html:`<b>${o[0]}</b>은(는) ${chip(o[1])}<br>${list}`};
    }
    q=`${T[t][0]}(${T[t][1]}형) 바이러스에 속하는 과는?`;
    opts=shuf([f[0],...shuf(out).slice(0,3).map(v=>v[0])]);a=opts.indexOf(f[0]);
    return {q,opts,a,html:`${list}`};
  }
  if(kind==="d2f"){
    const d=rnd(f[3]);q=`${d}의 원인 바이러스 과는?`;
    const others=shuf(V.filter(v=>v!==f)).slice(0,3).map(v=>v[0]);
    opts=shuf([f[0],...others]);a=opts.indexOf(f[0]);
  }else if(kind==="f2t"||kind==="d2t"){
    q=kind==="f2t"?`${f[0]}의 핵산 유형은?`:`${rnd(f[3])}의 원인 바이러스 핵산 유형은?`;
    const others=shuf(T.map((_,i)=>i).filter(i=>i!==f[1])).slice(0,3);
    const ids=shuf([f[1],...others]);opts=ids.map(i=>`${T[i][1]}. ${T[i][0]}`);a=ids.indexOf(f[1]);
  }else{
    q=`${f[0]}는 외피(envelope)가 있다?`;opts=["O","X"];a=f[2]?0:1;
  }
  return {q,opts,a,html:note(f)};
}
const QN=()=>window.QNum?QNum.get():0;
let S={};
function home(){
  $.innerHTML=`<h1>바이러스 분류 퀴즈</h1><p class="sub">수의사 국가시험 · 교재 기준 볼티모어 분류</p>`+
  MODES.map(m=>`<button class="mode" data-m="${m[0]}"><b>${m[1]}</b></button>`).join("");
  $.insertAdjacentHTML("beforeend",`<button class="mode" id="ch"><b>정리표 이미지 보기</b></button>`);
  $.querySelectorAll(".mode[data-m]").forEach(b=>b.onclick=()=>start(b.dataset.m));
  document.getElementById("ch").onclick=chart;
  if(window.QNum)QNum.mount($.querySelector(".mode"));
}
function chart(){
  $.innerHTML=`<button class="back" id="bk">← 뒤로</button><h1 style="font-size:22px">바이러스 분류 정리표</h1><p class="sub" style="margin:0 0 8px;font-size:13px">스크롤·핀치로 확대/축소 · 드래그로 이동 · 더블클릭(두 번 탭)으로 확대/초기화</p><div class="chart" id="cv" style="height:72vh;max-height:none"></div>`;
  document.getElementById("bk").onclick=home;
  const im=new Image();im.src=IMG;im.alt="바이러스 분류 정리표";
  const cv=document.getElementById("cv");cv.appendChild(im);
  if(window.ZoomView)ZoomView.attach(cv,im);
}
function start(mode,list){
  S={mode,qs:list||Array.from({length:QN()||(mode==="pr"?10:20)},()=>make(mode)),i:0,score:0,wrong:[]};
  show();
}
function show(){
  const q=S.qs[S.i],n=S.qs.length;
  $.innerHTML=`<button class="back" id="bk">← 뒤로</button><div class="meta"><span>${S.i+1} / ${n}</span><span>정답 ${S.score}</span></div>
  <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
  <div class="q">${q.q}</div><div id="opts">${q.opts.map((o,i)=>`<button class="opt" data-sfx="none" data-i="${i}">${q.opts.length===5?"①②③④⑤"[i]+" ":""}${o}</button>`).join("")}</div><div id="fb"></div>`;
  $.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  document.getElementById("bk").onclick=home;
}
function pick(i){
  const q=S.qs[S.i],bs=$.querySelectorAll(".opt");
  bs.forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("ok");else if(k===i)b.classList.add("no")});
  if(i===q.a){S.score++;window.SFX&&SFX.ok()}else{S.wrong.push(q);window.SFX&&SFX.no()}
  const last=S.i===S.qs.length-1;
  document.getElementById("fb").innerHTML=`<div class="exp">${i===q.a?"정답!":"오답"} · ${q.html}</div><button class="btn" id="nx">${last?"결과 보기":"다음 문제"}</button>`;
  const nx=document.getElementById("nx");nx.onclick=()=>{if(last)result();else{S.i++;show()}};nx.focus();
}
function result(){window.SFX&&SFX.done();
  const n=S.qs.length,w=S.wrong;
  $.innerHTML=`<div class="meta"><span>결과</span></div><div class="score">${S.score} / ${n}</div>
  <p class="sub">${w.length?`틀린 문제 ${w.length}개를 다시 풀어보세요.`:"전부 맞혔어요!"}</p>`+
  w.map(q=>`<div class="wrong"><b>${q.q}</b><span class="ans">정답: ${q.opts[q.a]}</span><br>${q.html}</div>`).join("")+
  (w.length?`<button class="btn" id="re">틀린 문제만 다시 풀기</button>`:"")+
  `<button class="btn alt" id="ag">같은 모드로 새 문제</button><button class="btn alt" id="hm">처음으로</button>`;
  const g=id=>document.getElementById(id);
  if(w.length)g("re").onclick=()=>start(S.mode,shuf(w));
  g("ag").onclick=()=>start(S.mode);g("hm").onclick=home;
}
